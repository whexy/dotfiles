# The ruff and basedpyright settings every Python package here shares. Each
# package's pyproject.toml extends this file by its relative path, so the
# checks (default.nix) lay the source out as the repository does.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.basedpyright]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "recommended"
# Discarding dict.pop() and similar results is idiomatic.
reportUnusedCallResult = false
