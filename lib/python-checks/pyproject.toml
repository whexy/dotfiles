# The basedpyright settings every Python package here shares, and the
# repository's ruff settings. Each package's pyproject.toml extends this file
# by its relative path, so the checks (default.nix) lay the source out as the
# repository does.

[tool.ruff]
extend = "../../ruff.toml"

[tool.basedpyright]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "recommended"
# Discarding dict.pop() and similar results is idiomatic.
reportUnusedCallResult = false
