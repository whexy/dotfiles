variables:
  # Run the heavy Nix steps on k8s-3, beside the CI cache. They take less than
  # half as long there as on k8s-4 or k8s-5, which have as much memory, so the
  # request alone does not keep them off those nodes.
  - &k8s_heavy
    kubernetes:
      nodeSelector:
        kubernetes.io/hostname: k8s-3
      resources:
        requests:
          memory: 8Gi
          cpu: "4"
        limits:
          memory: 12Gi # <= LimitRange max
          cpu: "16" # <= LimitRange max; let nix use many of k8s-3's 24 cores
  # The shared CI cache's credentials, the only secrets a pull-request step may
  # have. nix-ci fetches whatever an earlier run built and uploads, signed,
  # what this one builds, so a package or check none of whose inputs changed
  # is downloaded instead of built.
  - &ci_cache
    AWS_ACCESS_KEY_ID:
      from_secret: ci_cache_access_key
    AWS_SECRET_ACCESS_KEY:
      from_secret: ci_cache_secret_key
    NIX_CACHE_SIGNING_KEY:
      from_secret: nix_cache_signing_key
  # GitHub App credentials, the build cache and Rex's token, which the update
  # lane needs.
  - &github_app
    <<: *ci_cache
    GITHUB_APP_ID:
      from_secret: github_app_id
    GITHUB_APP_INSTALLATION_ID:
      from_secret: github_app_installation_id
    GITHUB_APP_PRIVATE_KEY:
      from_secret: github_app_private_key
    REX_PACKAGE_TOKEN:
      from_secret: rex_package_token
  # pkgs.superlogical.com serves the rex input only with Rex's testing token.
  # A pull-request step goes without it and substitutes the input from the CI
  # cache, where every check on master archives it.
  - &rex_netrc |
    netrc=$(mktemp)
    printf 'machine pkgs.superlogical.com login rex password %s\n' "$REX_PACKAGE_TOKEN" >"$netrc"
    export NIX_CONFIG="$NIX_CONFIG
    netrc-file = $netrc"
  # Lint, then evaluate one configuration of each kind without building it.
  # `nix flake check --all-systems` is too memory-heavy for this repo after
  # Blueprint host discovery. A tree that passes is recorded in the CI cache,
  # so a pull request that lands on master unchanged is not checked again.
  # Woodpecker substitutes braced variables anywhere in this file, so the
  # script refers to shell variables only as bare $name.
  - &check |
    tree=$(git rev-parse 'HEAD^{tree}')
    passed=$(nix eval --raw --expr "builtins.toFile \"dotfiles-ci-passed\" \"$tree\"")
    if nix path-info --store "$CI_CACHE_ENDPOINT/nix" "$passed" >/dev/null 2>&1; then
      echo "OK - tree $tree already passed"
    else
      system=$(nix eval --raw --impure --expr builtins.currentSystem)
      nix build --accept-flake-config ".#checks.$system.pre-commit" ".#checks.$system.bot-update-rollout" ".#checks.$system.package-updaters" ".#checks.$system.agent-skills" ".#packages.$system.dotfiles-upgraded" -L --no-link

      # A skill edit can break its frontmatter or a patch over it, which the
      # agent-skills check above has already caught. Beyond that, Nix passes
      # skills through as paths and reads markdown only as text, so editing
      # them can break evaluation only by removing a file.
      docs_only=$(nix eval --impure --expr '
        let files = builtins.fromJSON (builtins.getEnv "CI_PIPELINE_FILES"); in
        files != [ ] && builtins.all (f:
          builtins.match "docs/.*|.*[.]md|modules/home/agents/skills/.*" f != null
          && builtins.pathExists (./. + ("/" + f))
        ) files' 2>/dev/null) || docs_only=false
      nix build --accept-flake-config ".#checks.$system.t3-tailnet" -L --no-link
      if [ "$docs_only" = true ]; then
        echo "OK - only docs, markdown and skills changed"
      else
        nix eval --impure --json --show-trace --expr '
          let flake = builtins.getFlake (toString ./.); in {
            ellison = flake.nixosConfigurations.ellison.config.system.build.toplevel.drvPath;
            golf = flake.darwinConfigurations.golf.system.drvPath;
            "wenxuan@mars" = flake.legacyPackages.x86_64-linux.homeConfigurations."wenxuan@mars".activationPackage.drvPath;
          }'
        echo "OK - configurations evaluate"

        # nix-ci uploads only what it builds, so every Pod would otherwise
        # fetch the flake inputs from GitHub and cache.nixos.org again.
        keyfile=$(mktemp)
        printf '%s' "$NIX_CACHE_SIGNING_KEY" | tr -d '[:space:]' >"$keyfile"
        store="s3://nix?endpoint=$CI_CACHE_ENDPOINT&region=us-east-1&compression=zstd&multipart-upload=true&secret-key=$keyfile"
        timeout 300 nix flake archive --accept-flake-config --to "$store" ||
          echo "Could not upload the flake inputs"
        nix copy --to "$store" "$passed" || echo "Could not record that tree $tree passed"
        rm -f "$keyfile"
      fi
    fi
  # Push the update lane's checked commits to the primary branch as the
  # GitHub App, retrying a failed push 3 times.
  - &push |
    GITHUB_TOKEN="$(nix run --accept-flake-config .#github-app-token)"
    origin_url="$(git remote get-url origin)"
    trap 'git remote set-url origin "$origin_url"' EXIT
    git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/whexy/dotfiles.git"
    attempt=1
    until git push origin HEAD:master; do
      [ "$attempt" -le 3 ] || exit 1
      sleep $((attempt * 10))
      attempt=$((attempt + 1))
    done
# Branches other than master are checked through their pull requests.
when:
  - event: push
    branch: master
  - event: [pull_request, manual]
  - event: cron
    cron: nightly
labels:
  platform: linux/amd64
clone:
  # The clone's Pod binds the local-path workspace to its node, and every later
  # step follows it there, so it asks for what the heavy steps need.
  - name: git
    image: woodpeckerci/plugin-git
    backend_options: *k8s_heavy
steps:
  # Update every flake input and every package that pins an upstream release
  # (nightly cron, or a manual run), one commit each, then check the commits
  # and push them directly to the repository's primary branch.
  update:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    when:
      - event: cron
        cron: nightly
      # whexy/t3code's CI starts a manual run with T3CODE_FORK_REV after each
      # build; it is not a request to update.
      - event: manual
        evaluate: '(T3CODE_FORK_REV ?? "") == ""'
    backend_options: *k8s_heavy
    environment: *github_app
    commands:
      - *rex_netrc
      - git config user.name "whexy-bot[bot]"
      - git config user.email "315421218+whexy-bot[bot]@users.noreply.github.com"
      - start=$(git rev-parse HEAD)
      - cp flake.lock /tmp/flake.lock.old
      - nix flake update
      - |
        if git diff --quiet -- flake.lock; then
          echo "No changes to flake.lock"
        else
          git add flake.lock
          # The package report is informational; a failure must not block the update.
          report="$(nix run --accept-flake-config .#flake-lock-diff -- --jobs 2 /tmp/flake.lock.old)" ||
            report="Package report unavailable; see the CI log."
          # The push records a rollout status; the tree cache reuses this check.
          git commit -m "chore: update flake inputs" -m "$report"
        fi
      # The driver reverts a package it cannot update and exits non-zero at
      # the end, so the other updates are still checked and pushed before the
      # step fails and report-failure runs.
      - updated=0
      - nix run --accept-flake-config .#update -- --commit || updated=$?
      - |
        if [ "$(git rev-parse HEAD)" = "$start" ]; then
          echo "Nothing to update"
          exit "$updated"
        fi
      - *check
      - *push
      - exit "$updated"
  # Pin the t3code-fork input to a commit whexy/t3code's CI built and pushed
  # to whexy-t3code.cachix.org. That CI starts this lane through Woodpecker's
  # API, as a manual run with the variable T3CODE_FORK_REV; no other manual
  # step runs then. A rev that is no longer the fork's head is superseded by
  # the run its successor starts, so it ends without pinning.
  pin-t3code-fork:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    when:
      - event: manual
        evaluate: '(T3CODE_FORK_REV ?? "") != ""'
    backend_options: *k8s_heavy
    environment: *github_app
    commands:
      - *rex_netrc
      - git config user.name "whexy-bot[bot]"
      - git config user.email "315421218+whexy-bot[bot]@users.noreply.github.com"
      - |
        rev=$T3CODE_FORK_REV
        stage=validate
        origin_url=
        reported=
        # Every failure names its stage, which the repair task reads; the push
        # stage also gets the plain origin URL back.
        trap 'status=$?; if [ -n "$origin_url" ]; then git remote set-url origin "$origin_url"; fi; if [ "$status" -ne 0 ] && [ -z "$reported" ]; then echo "FAILED($stage) - exit $status"; fi' EXIT
        fail() {
          echo "FAILED($stage) - $*"
          reported=1
          exit 1
        }
        # Ends the run as SUPERSEDED once the fork has moved past rev. Failing
        # to read the head is a failure, not a newer commit.
        check_head() {
          if ! head=$(git ls-remote --exit-code https://github.com/whexy/t3code refs/heads/self-hosted-nightly); then
            fail "cannot read the head of whexy/t3code self-hosted-nightly"
          fi
          case $head in
            "$rev"[[:space:]]*) ;;
            *)
              echo "SUPERSEDED - $rev is no longer the head of whexy/t3code self-hosted-nightly"
              exit 0
              ;;
          esac
        }
        case $rev in
          *[!0-9a-f]* | "") valid=false ;;
          *) [ "$(printf %s "$rev" | wc -c)" -eq 40 ] && valid=true || valid=false ;;
        esac
        [ "$valid" = true ] || fail "T3CODE_FORK_REV is not a full commit hash: $rev"
        check_head
      # Every host substitutes the server, so its whole closure must be in
      # Cachix or cache.nixos.org. A dry run against an empty store lists
      # what Nix would have to build instead.
      - |
        stage=cache
        store=$(mktemp -d)
        errors=$(mktemp)
        for system in x86_64-linux aarch64-darwin; do
          if ! out=$(nix eval --raw "github:whexy/t3code/$rev#packages.$system.t3-server.outPath" 2>"$errors"); then
            cat "$errors"
            fail "cannot evaluate the $system t3-server"
          fi
          if ! plan=$(nix build --dry-run --store "$store" \
            --option substituters "https://cache.nixos.org https://whexy-t3code.cachix.org" \
            --option trusted-public-keys "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= whexy-t3code.cachix.org-1:/pDSZMaQ8YHPw/og8nsuwxiYCAAcRB8JYEcmNd2Czyg=" \
            "$out" 2>&1); then
            echo "$plan"
            fail "the dry run for the $system t3-server failed"
          fi
          case $plan in
            *"will be built"* | *"know how to build"*)
              echo "$plan"
              fail "the $system t3-server is not fully cached"
              ;;
          esac
          echo "OK - $system $out is cached"
        done
        rm -rf "$store" "$errors"
      - |
        stage=pin
        old=$(nix eval --raw --impure --expr '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.t3code-fork.locked.rev')
        nix shell --inputs-from . nixpkgs#gnused -c sed -i "s|github:whexy/t3code/[0-9a-f]\{40\}|github:whexy/t3code/$rev|" flake.nix
        nix flake update t3code-fork
        if git diff --quiet; then
          echo "NOOP - t3code-fork is already pinned to $rev"
          exit 0
        fi
        # The desktop app follows the version the new server builds.
        nix run --accept-flake-config .#update -- t3code-desktop-nightly
        version=$(nix eval --raw .#packages.x86_64-linux.t3code-fork.version)
        git add -A
        git commit -m "chore(t3code-fork): pin $rev ($version)" \
          -m "https://github.com/whexy/t3code/compare/$old...$rev"
      - stage=check
      - *check
      # Push as the GitHub App onto whatever master became meanwhile, as long
      # as the rev is still the fork's head. A newer pin that landed first
      # supersedes this one rather than conflicting with it.
      - |
        stage=push
        GITHUB_TOKEN="$(nix run --accept-flake-config .#github-app-token)"
        origin_url="$(git remote get-url origin)"
        git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/whexy/dotfiles.git"
        attempt=1
        while :; do
          check_head
          git fetch origin master
          if ! git rebase origin/master; then
            git rebase --abort
            check_head
            fail "the pin does not rebase onto master"
          fi
          if git push origin HEAD:master; then
            echo "OK - pinned t3code-fork to $rev"
            break
          fi
          [ "$attempt" -lt 3 ] || fail "3 attempts"
          sleep $((attempt * 10))
          attempt=$((attempt + 1))
        done
  check:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    backend_options: *k8s_heavy
    when:
      event: push
    environment:
      <<: *ci_cache
      REX_PACKAGE_TOKEN:
        from_secret: rex_package_token
    commands:
      - *rex_netrc
      - *check
  # Woodpecker fails a step that names a secret its event may not use, so pull
  # requests check in their own step, without Rex's token.
  check-pr:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    backend_options: *k8s_heavy
    when:
      event: pull_request
    environment: *ci_cache
    commands:
      - *check
  # Build docs (astro) only when docs/ changes on master
  build-docs:
    image: node:22-alpine
    when:
      - event: push
        branch: master
        path: "docs/**"
    commands:
      - echo "=== Building docs with astro ==="
      - cd docs
      - npm ci
      - npm run build
      - echo "OK - docs built"
  # Deploy docs to Cloudflare Workers (static assets) only when docs/ changes on master
  deploy-docs:
    image: node:22-alpine
    when:
      - event: push
        branch: master
        path: "docs/**"
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CLOUDFLARE_ACCOUNT_ID
    commands:
      - echo "=== Deploying docs to Cloudflare Workers ==="
      - cd docs
      # wrangler is a docs devDependency, installed by build-docs.
      - npx wrangler deploy
      - echo "OK - deployed"
  # Report a failure on master to the T3 Code task that repairs it (see
  # AGENTS.md). It runs last and no step sets depends_on, so the steps run in
  # order and a failure in any of them reaches this one. Should the task not
  # take the report, the alert webhook sends it to WeChat instead.
  report-failure:
    image: curlimages/curl:8.19.0
    when:
      - event: [push, cron, manual]
        branch: master
        status: failure
    environment:
      T3_REPAIR_WEBHOOK:
        from_secret: t3_repair_webhook
    commands:
      - |
        # A cron pipeline's message is the cron's name.
        cron=
        if [ "$CI_PIPELINE_EVENT" = cron ]; then cron=$CI_COMMIT_MESSAGE; fi
        # The pin lane's rev, which the task's dedupe key includes.
        case $T3CODE_FORK_REV in
          *[!0-9a-f]*) rev=invalid ;;
          *) rev=$T3CODE_FORK_REV ;;
        esac
        body=$(printf '{"event":"%s","cron":"%s","branch":"%s","commit":"%s","pipeline":"%s","pipeline_url":"%s","t3code_fork_rev":"%s"}' \
          "$CI_PIPELINE_EVENT" "$cron" "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA" "$CI_PIPELINE_NUMBER" "$CI_PIPELINE_URL" "$rev")
        # Bounded, so a stalled task server still leaves time for the alert.
        if headers=$(curl -fsS --connect-timeout 5 --max-time 20 -o /dev/null -D - -X POST \
          -H 'content-type: application/json' --data "$body" "$T3_REPAIR_WEBHOOK"); then
          printf '%s\n' "$headers" | grep -i '^x-t3-hook-outcome'
        else
          alert=$(printf '{"source":"dotfiles-ci","severity":"error","title":"%s","detail":"%s","url":"%s"}' \
            "dotfiles pipeline $CI_PIPELINE_NUMBER failed and its repair task did not take it" \
            "event=$CI_PIPELINE_EVENT commit=$CI_COMMIT_SHA t3code_fork_rev=$rev" "$CI_PIPELINE_URL")
          curl -fsS -o /dev/null --max-time 10 -X POST -H 'content-type: application/json' \
            --data "$alert" https://n8n.clusters.work/webhook/t3code-alert
          exit 1
        fi
