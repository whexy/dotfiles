when:
  event: [push, pull_request, cron]
  cron: nightly
steps:
  # Update flake inputs (cron only)
  update-flake:
    image: nixos/nix:latest
    when:
      event: cron
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - git config user.name "Woodpecker CI"
      - git config user.email "ci@woodpecker.local"
      - nix flake update --extra-experimental-features 'nix-command flakes'
      - |
        if git diff --quiet flake.lock; then
          echo "No changes to flake.lock"
        else
          git add flake.lock
          git commit -m "chore: update flake inputs"
          git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/whexy/dotfiles.git
          git push origin HEAD:master
        fi
  # Verify flake structure
  check-flake:
    image: nixos/nix:latest
    when:
      event: [push, pull_request]
    commands:
      - echo "Verifying flake structure..."
      - nix flake check --extra-experimental-features 'nix-command flakes'
  # Evaluate all configurations
  check-configs:
    image: nixos/nix:latest
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Evaluating all configurations ==="
      - nix eval --extra-experimental-features 'nix-command flakes' .#nixosConfigurations.remote-dev.config.system.build.toplevel.drvPath --show-trace
      - echo "OK - remote-dev"
      - nix eval --extra-experimental-features 'nix-command flakes' .#nixosConfigurations.wsl.config.system.build.toplevel.drvPath --show-trace
      - echo "OK - wsl"
      - nix eval --extra-experimental-features 'nix-command flakes' .#darwinConfigurations.mbp.system.drvPath --show-trace
      - echo "OK - mbp"
      - nix eval --extra-experimental-features 'nix-command flakes' .#homeConfigurations.home.activationPackage.drvPath --impure --show-trace
      - echo "OK - home (x86_64)"
      - nix eval --extra-experimental-features 'nix-command flakes' .#homeConfigurations.home-aarch64.activationPackage.drvPath --impure --show-trace
      - echo "OK - home (aarch64)"
      - echo "SUCCESS - All configurations evaluate correctly"
