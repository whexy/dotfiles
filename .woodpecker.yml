# Pin heavy Nix steps to the big node (k8s-3). Referenced via YAML anchor below.
variables:
  - &k8s_heavy
    kubernetes:
      # nix-ci is amd64-only.
      nodeSelector:
        kubernetes.io/arch: amd64
      resources:
        requests:
          memory: 8Gi # only k8s-3 (~45Gi) can satisfy -> pinned to the big node
          cpu: "4"
        limits:
          memory: 12Gi # <= LimitRange max
          cpu: "16" # <= LimitRange max; let nix use many of k8s-3's 24 cores
  # The first Pod binds the local-path workspace; later steps follow its node.
  - &amd64
    kubernetes:
      nodeSelector:
        kubernetes.io/arch: amd64
  # The shared CI cache's credentials, the only secrets a pull-request step may
  # have. nix-ci fetches whatever an earlier run built and uploads, signed,
  # what this one builds, so a package or check none of whose inputs changed
  # is downloaded instead of built.
  - &ci_cache
    AWS_ACCESS_KEY_ID:
      from_secret: ci_cache_access_key
    AWS_SECRET_ACCESS_KEY:
      from_secret: ci_cache_secret_key
    NIX_CACHE_SIGNING_KEY:
      from_secret: nix_cache_signing_key
  # GitHub App credentials and the build cache both update lanes need.
  - &github_app
    <<: *ci_cache
    GITHUB_APP_ID:
      from_secret: github_app_id
    GITHUB_APP_INSTALLATION_ID:
      from_secret: github_app_installation_id
    GITHUB_APP_PRIVATE_KEY:
      from_secret: github_app_private_key
when:
  event: [push, pull_request, cron, manual]
  cron: [nightly, weekly]
labels:
  platform: linux/amd64
clone:
  - name: git
    image: woodpeckerci/plugin-git
    backend_options: *amd64
steps:
  # Update every flake input (weekly cron, or a manual run)
  update-flake:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    when:
      - event: cron
        cron: weekly
      - event: manual
    backend_options: *k8s_heavy
    environment: *github_app
    commands:
      - cp flake.lock /tmp/flake.lock.old
      - nix flake update
      # Commit and push flake.lock directly to the repository's primary branch.
      # No-op (exit 0) when flake.lock is unchanged.
      - |
        if git diff --quiet -- flake.lock; then
          echo "No changes to flake.lock"
          exit 0
        fi

        git config user.name "whexy-bot[bot]"
        git config user.email "315421218+whexy-bot[bot]@users.noreply.github.com"
        git add flake.lock
        # The package report is informational; a failure must not block the update.
        report="$(nix run --accept-flake-config .#flake-lock-diff -- --jobs 2 /tmp/flake.lock.old)" ||
          report="Package report unavailable; see the CI log."
        git commit -m "chore: update flake inputs" -m "$report"

        GITHUB_TOKEN="$(nix run --accept-flake-config .#github-app-token)"
        origin_url="$(git remote get-url origin)"
        trap 'git remote set-url origin "$origin_url"' EXIT
        git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/whexy/dotfiles.git"
        git push origin HEAD:master
  # Update the fast-moving agent packages (nightly cron). The T3 and Muse
  # pins live in package metadata rather than flake.lock, so this lane updates
  # every pin in one serialized commit.
  update-nightly-agents:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    when:
      event: cron
      cron: nightly
    backend_options: *k8s_heavy
    environment: *github_app
    commands:
      - cp flake.lock /tmp/flake.lock.old
      - nix flake update llm-agents
      - ./packages/t3code-nightly/update.sh
      - ./packages/muse-code/update.sh
      - |
        system=$(nix eval --raw --impure --expr 'builtins.currentSystem')
        t3code=$(nix build ".#packages.$system.t3code-nightly" --no-link --print-out-paths)
        "$t3code/bin/t3" --version
        muse=$(nix build ".#packages.$system.muse-code" --no-link --print-out-paths)
        "$muse/bin/muse" --version
      # Commit and push the nightly pins directly to the repository's primary
      # branch. No-op (exit 0) when neither nightly pin changed.
      - |
        if git diff --quiet -- flake.lock packages/t3code-nightly/metadata.nix packages/muse-code/metadata.nix; then
          echo "No nightly package changes"
          exit 0
        fi

        git config user.name "whexy-bot[bot]"
        git config user.email "315421218+whexy-bot[bot]@users.noreply.github.com"
        git add flake.lock packages/t3code-nightly/metadata.nix packages/muse-code/metadata.nix
        # The package report is informational; a failure must not block the update.
        report="$(nix run --accept-flake-config .#flake-lock-diff -- --jobs 2 /tmp/flake.lock.old)" ||
          report="Package report unavailable; see the CI log."
        git commit -m "chore: update nightly agent packages" -m "$report"

        GITHUB_TOKEN="$(nix run --accept-flake-config .#github-app-token)"
        origin_url="$(git remote get-url origin)"
        trap 'git remote set-url origin "$origin_url"' EXIT
        git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/whexy/dotfiles.git"
        git push origin HEAD:master
  # Run lint checks and evaluate NixOS configurations without building every
  # Blueprint-generated host closure. `nix flake check --all-systems` is too
  # memory-heavy for this repo after Blueprint host discovery.
  check-flake:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    backend_options: *k8s_heavy
    depends_on: []
    when:
      event: [push, pull_request]
    environment: *ci_cache
    commands:
      - echo "=== Running pre-commit checks ==="
      - |
        SYSTEM=$(nix eval --accept-flake-config --raw --impure --expr 'builtins.currentSystem')
        nix build --accept-flake-config ".#checks.$SYSTEM.pre-commit" -L --no-link
      - echo "=== Evaluating representative NixOS configurations ==="
      - |
        for config in \
          ellison \
          wsl
        do
          echo "Evaluating $config..."
          nix eval --accept-flake-config ".#nixosConfigurations.$config.config.system.build.toplevel.drvPath" --show-trace
          echo "OK - $config"
        done
      - echo "OK - representative NixOS configurations evaluate correctly"
  # Evaluate darwin and home-manager configurations (not covered by flake check).
  # It builds nothing, so it has nothing to upload and gets no cache secrets.
  check-extra-configs:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    backend_options: *k8s_heavy
    depends_on: []
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Evaluating darwin configurations ==="
      - nix eval .#darwinConfigurations.golf.system.drvPath --show-trace
      - echo "OK - golf"
      - echo "=== Evaluating home-manager configurations ==="
      - nix eval .#homeConfigurations.wenxuan@mars.activationPackage.drvPath --impure --show-trace
      - echo "OK - mars (x86_64)"
      - echo "SUCCESS - All configurations evaluate correctly"
  # Build docs (astro) only when docs/ changes on master
  build-docs:
    image: node:22-alpine
    backend_options: *amd64
    when:
      - event: push
        branch: master
        path: "docs/**"
    commands:
      - echo "=== Building docs with astro ==="
      - cd docs
      - npm ci
      - npm run build
      - echo "OK - docs built"
  # Deploy docs to Cloudflare Workers (static assets) only when docs/ changes on master
  deploy-docs:
    image: node:22-alpine
    backend_options: *amd64
    when:
      - event: push
        branch: master
        path: "docs/**"
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CLOUDFLARE_ACCOUNT_ID
    commands:
      - echo "=== Deploying docs to Cloudflare Workers ==="
      - cd docs
      - npx --yes wrangler@latest deploy
      - echo "OK - deployed"
    depends_on: [build-docs]
