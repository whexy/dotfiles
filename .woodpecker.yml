variables:
  # Run the heavy Nix steps on k8s-3, beside the CI cache. They take less than
  # half as long there as on k8s-4 or k8s-5, which have as much memory, so the
  # request alone does not keep them off those nodes.
  - &k8s_heavy
    kubernetes:
      nodeSelector:
        kubernetes.io/hostname: k8s-3
      resources:
        requests:
          memory: 8Gi
          cpu: "4"
        limits:
          memory: 12Gi # <= LimitRange max
          cpu: "16" # <= LimitRange max; let nix use many of k8s-3's 24 cores
  # The shared CI cache's credentials, the only secrets a pull-request step may
  # have. nix-ci fetches whatever an earlier run built and uploads, signed,
  # what this one builds, so a package or check none of whose inputs changed
  # is downloaded instead of built.
  - &ci_cache
    AWS_ACCESS_KEY_ID:
      from_secret: ci_cache_access_key
    AWS_SECRET_ACCESS_KEY:
      from_secret: ci_cache_secret_key
    NIX_CACHE_SIGNING_KEY:
      from_secret: nix_cache_signing_key
  # GitHub App credentials and the build cache both update lanes need.
  - &github_app
    <<: *ci_cache
    GITHUB_APP_ID:
      from_secret: github_app_id
    GITHUB_APP_INSTALLATION_ID:
      from_secret: github_app_installation_id
    GITHUB_APP_PRIVATE_KEY:
      from_secret: github_app_private_key
  # Lint, then evaluate one configuration of each kind without building it.
  # `nix flake check --all-systems` is too memory-heavy for this repo after
  # Blueprint host discovery. A tree that passes is recorded in the CI cache,
  # so a pull request that lands on master unchanged is not checked again.
  # Woodpecker substitutes braced variables anywhere in this file, so the
  # script refers to shell variables only as bare $name.
  - &check |
    tree=$(git rev-parse 'HEAD^{tree}')
    passed=$(nix eval --raw --expr "builtins.toFile \"dotfiles-ci-passed\" \"$tree\"")
    if nix path-info --store "$CI_CACHE_ENDPOINT/nix" "$passed" >/dev/null 2>&1; then
      echo "OK - tree $tree already passed"
    else
      system=$(nix eval --raw --impure --expr builtins.currentSystem)
      nix build --accept-flake-config ".#checks.$system.pre-commit" -L --no-link

      # Nix passes agent skills through as paths and reads markdown only as
      # text, so editing them can break evaluation only by removing a file.
      docs_only=$(nix eval --impure --expr '
        let files = builtins.fromJSON (builtins.getEnv "CI_PIPELINE_FILES"); in
        files != [ ] && builtins.all (f:
          builtins.match "docs/.*|.*[.]md|modules/home/agents/skills/.*" f != null
          && builtins.pathExists (./. + ("/" + f))
        ) files' 2>/dev/null) || docs_only=false
      if [ "$docs_only" = true ]; then
        echo "OK - only docs, markdown and skills changed"
      else
        nix eval --impure --json --show-trace --expr '
          let flake = builtins.getFlake (toString ./.); in {
            ellison = flake.nixosConfigurations.ellison.config.system.build.toplevel.drvPath;
            golf = flake.darwinConfigurations.golf.system.drvPath;
            "wenxuan@mars" = flake.legacyPackages.x86_64-linux.homeConfigurations."wenxuan@mars".activationPackage.drvPath;
          }'
        echo "OK - configurations evaluate"

        # nix-ci uploads only what it builds, so every Pod would otherwise
        # fetch the flake inputs from GitHub and cache.nixos.org again.
        keyfile=$(mktemp)
        printf '%s' "$NIX_CACHE_SIGNING_KEY" | tr -d '[:space:]' >"$keyfile"
        store="s3://nix?endpoint=$CI_CACHE_ENDPOINT&region=us-east-1&compression=zstd&multipart-upload=true&secret-key=$keyfile"
        timeout 300 nix flake archive --accept-flake-config --to "$store" ||
          echo "Could not upload the flake inputs"
        nix copy --to "$store" "$passed" || echo "Could not record that tree $tree passed"
        rm -f "$keyfile"
      fi
    fi
  # Push the update lanes' checked commit to the primary branch as the GitHub
  # App, retrying a failed push 3 times.
  - &push |
    GITHUB_TOKEN="$(nix run --accept-flake-config .#github-app-token)"
    origin_url="$(git remote get-url origin)"
    trap 'git remote set-url origin "$origin_url"' EXIT
    git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/whexy/dotfiles.git"
    attempt=1
    until git push origin HEAD:master; do
      [ "$attempt" -le 3 ] || exit 1
      sleep $((attempt * 10))
      attempt=$((attempt + 1))
    done
# Branches other than master are checked through their pull requests.
when:
  - event: push
    branch: master
  - event: [pull_request, manual]
  - event: cron
    cron: [nightly, weekly]
labels:
  platform: linux/amd64
clone:
  # The clone's Pod binds the local-path workspace to its node, and every later
  # step follows it there, so it asks for what the heavy steps need.
  - name: git
    image: woodpeckerci/plugin-git
    backend_options: *k8s_heavy
steps:
  # Update every flake input (weekly cron, or a manual run)
  update-flake:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    when:
      - event: cron
        cron: weekly
      - event: manual
    backend_options: *k8s_heavy
    environment: *github_app
    commands:
      - cp flake.lock /tmp/flake.lock.old
      - nix flake update
      # Commit flake.lock, check it, and push it directly to the repository's
      # primary branch. No-op (exit 0) when flake.lock is unchanged.
      - |
        if git diff --quiet -- flake.lock; then
          echo "No changes to flake.lock"
          exit 0
        fi

        git config user.name "whexy-bot[bot]"
        git config user.email "315421218+whexy-bot[bot]@users.noreply.github.com"
        git add flake.lock
        # The package report is informational; a failure must not block the update.
        report="$(nix run --accept-flake-config .#flake-lock-diff -- --jobs 2 /tmp/flake.lock.old)" ||
          report="Package report unavailable; see the CI log."
        # The push records a rollout status; the tree cache reuses this check.
        git commit -m "chore: update flake inputs" -m "$report"
      - *check
      - *push
  # Update the fast-moving agent packages (nightly cron). The T3 pin lives in
  # package metadata rather than flake.lock, so this lane updates both pins in
  # one serialized commit.
  update-nightly-agents:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    when:
      event: cron
      cron: nightly
    backend_options: *k8s_heavy
    environment: *github_app
    commands:
      - cp flake.lock /tmp/flake.lock.old
      - cp packages/t3code-nightly/metadata.nix /tmp/t3code-metadata.old.nix
      - nix flake update llm-agents
      - ./packages/t3code-nightly/update.sh
      - |
        system=$(nix eval --raw --impure --expr 'builtins.currentSystem')
        t3code=$(nix build ".#packages.$system.t3code-nightly" --no-link --print-out-paths)
        "$t3code/bin/t3" --version
      # Commit the nightly pins, check them, and push them directly to the
      # repository's primary branch. No-op (exit 0) when neither pin changed.
      - |
        if git diff --quiet -- flake.lock packages/t3code-nightly/metadata.nix; then
          echo "No nightly package changes"
          exit 0
        fi

        git config user.name "whexy-bot[bot]"
        git config user.email "315421218+whexy-bot[bot]@users.noreply.github.com"
        git add flake.lock packages/t3code-nightly/metadata.nix
        # The package report is informational; a failure must not block the update.
        report="$(nix run --accept-flake-config .#flake-lock-diff -- --jobs 2 /tmp/flake.lock.old)" ||
          report="Package report unavailable; see the CI log."
        # The report compares flake.lock only, so it never sees the T3 pin move.
        t3_old=$(nix eval --raw --file /tmp/t3code-metadata.old.nix version)
        t3_new=$(nix eval --raw --file packages/t3code-nightly/metadata.nix version)
        if [ "$t3_old" != "$t3_new" ]; then
          report=$(printf '%s\n\nT3 Code:\n  t3code-nightly  %s -> %s' "$report" "$t3_old" "$t3_new")
        fi
        # The push records a rollout status; the tree cache reuses this check.
        git commit -m "chore: update nightly agent packages" -m "$report"
      - *check
      - *push
  # Publish the cluster's MCP hub image (packages/t3code-hub-image) at the T3
  # version the hosts pin, right after the nightly lane moves that pin, and
  # whenever the image, the package or this step changes. A version already in
  # GHCR is left alone. argocd-image-updater rolls the hub (clusters-work
  # gitops/apps/t3code-hub).
  publish-t3code-hub:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    when:
      - event: cron
        cron: nightly
      - event: manual
      - event: push
        branch: master
        path:
          [
            ".woodpecker.yml",
            "packages/t3code-hub-image/**",
            "packages/t3code-nightly/**",
          ]
    backend_options: *k8s_heavy
    environment:
      <<: *ci_cache
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - |
        version=$(nix eval --raw --file packages/t3code-nightly/metadata.nix version)
        ref="docker://ghcr.io/whexy/t3code-hub:$version"
        skopeo() { nix shell --inputs-from . nixpkgs#skopeo -c skopeo "$@"; }
        if skopeo inspect --creds "whexy:$GHCR_TOKEN" "$ref" >/dev/null 2>&1; then
          echo "OK - t3code-hub $version is already published"
          exit 0
        fi
        stream=$(nix build --accept-flake-config .#t3code-hub-image --no-link --print-out-paths)
        "$stream" >/tmp/t3code-hub.tar
        # The CI image has no containers policy.json, which skopeo needs to copy.
        skopeo --insecure-policy copy --dest-creds "whexy:$GHCR_TOKEN" docker-archive:/tmp/t3code-hub.tar "$ref"
        echo "OK - published t3code-hub $version"
  check:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    backend_options: *k8s_heavy
    when:
      event: [push, pull_request]
    environment: *ci_cache
    commands:
      - *check
  # Build docs (astro) only when docs/ changes on master
  build-docs:
    image: node:22-alpine
    when:
      - event: push
        branch: master
        path: "docs/**"
    commands:
      - echo "=== Building docs with astro ==="
      - cd docs
      - npm ci
      - npm run build
      - echo "OK - docs built"
  # Deploy docs to Cloudflare Workers (static assets) only when docs/ changes on master
  deploy-docs:
    image: node:22-alpine
    when:
      - event: push
        branch: master
        path: "docs/**"
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CLOUDFLARE_ACCOUNT_ID
    commands:
      - echo "=== Deploying docs to Cloudflare Workers ==="
      - cd docs
      # wrangler is a docs devDependency, installed by build-docs.
      - npx wrangler deploy
      - echo "OK - deployed"
    depends_on: [build-docs]
