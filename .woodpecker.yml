when:
  event: [push, pull_request, cron]
  cron: nightly
steps:
  # Update flake inputs (cron only)
  update-flake:
    image: nixos/nix:latest
    when:
      event: cron
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - git config user.name "Woodpecker CI"
      - git config user.email "ci@woodpecker.local"
      - nix flake update --extra-experimental-features 'nix-command flakes'
      - |
        if git diff --quiet flake.lock; then
          echo "No changes to flake.lock"
        else
          git add flake.lock
          git commit -m "chore: update flake inputs"
          git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/whexy/dotfiles.git
          git push origin HEAD:master
        fi
  # Verify flake structure
  check-flake:
    image: nixos/nix:latest
    when:
      event: [push, pull_request]
    commands:
      - echo "Verifying flake structure..."
      - nix flake check --extra-experimental-features 'nix-command flakes' --all-systems
  # NixOS x86_64-linux - Full build (native)
  build-nixos-remote-dev:
    image: nixos/nix:latest
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Building NixOS x86_64-linux remote-dev ==="
      - nix build --extra-experimental-features 'nix-command flakes' .#nixosConfigurations.remote-dev.config.system.build.toplevel -L --show-trace
      - echo "SUCCESS - Can be applied"
  build-nixos-wsl:
    image: nixos/nix:latest
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Building NixOS x86_64-linux wsl ==="
      - nix build --extra-experimental-features 'nix-command flakes' .#nixosConfigurations.wsl.config.system.build.toplevel -L --show-trace
      - echo "SUCCESS - Can be applied"
  # Darwin aarch64 - Evaluation and instantiation only
  check-darwin-mbp:
    image: nixos/nix:latest
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Checking Darwin aarch64 mbp ==="
      - echo "Evaluating configuration..."
      - nix eval --extra-experimental-features 'nix-command flakes' .#darwinConfigurations.mbp.system.drvPath
      - echo "Building derivation (without executing)..."
      - nix-instantiate --extra-experimental-features 'nix-command flakes' --eval -E '(builtins.getFlake (toString ./.)).darwinConfigurations.mbp.system' --show-trace
      - echo "SUCCESS - Configuration evaluates correctly"
      - echo "NOTE Cross-platform build not performed - requires macOS runner"
  check-darwin-mini:
    image: nixos/nix:latest
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Checking Darwin aarch64 mini ==="
      - echo "Evaluating configuration..."
      - nix eval --extra-experimental-features 'nix-command flakes' .#darwinConfigurations.mini.system.drvPath
      - echo "Building derivation (without executing)..."
      - nix-instantiate --extra-experimental-features 'nix-command flakes' --eval -E '(builtins.getFlake (toString ./.)).darwinConfigurations.mini.system' --show-trace
      - echo "SUCCESS - Configuration evaluates correctly"
      - echo "NOTE Cross-platform build not performed - requires macOS runner"
  # Home Manager - Full build (x86_64)
  build-home-manager:
    image: nixos/nix:latest
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Building Home Manager home (x86_64) ==="
      - nix build --extra-experimental-features 'nix-command flakes' .#homeConfigurations.home.activationPackage -L --show-trace --impure
      - echo "SUCCESS - Can be applied"
  # Home Manager - Check (aarch64)
  check-home-manager-aarch64:
    image: nixos/nix:latest
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Checking Home Manager home-aarch64 ==="
      - echo "Evaluating configuration..."
      - nix eval --extra-experimental-features 'nix-command flakes' .#homeConfigurations.home-aarch64.activationPackage.drvPath --impure
      - echo "SUCCESS - Configuration evaluates correctly"
  # Summary
  summary:
    image: nixos/nix:latest
    when:
      event: [push, pull_request]
    commands:
      - echo "========================================"
      - echo "CI Results Summary"
      - echo "========================================"
      - echo "NixOS configs     BUILT and tested"
      - echo "Darwin configs    EVALUATED (not built - requires macOS)"
      - echo "Home Manager      BUILT and tested"
      - echo ""
      - echo "NixOS and Home Manager configurations are ready to apply."
      - echo "Darwin configurations evaluated successfully but were not built."
      - echo "========================================"
