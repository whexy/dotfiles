# Pin heavy Nix steps to the big node (k8s-3). Referenced via YAML anchor below.
variables:
  - &k8s_heavy
    kubernetes:
      resources:
        requests:
          memory: 8Gi # only k8s-3 (~45Gi) can satisfy -> pinned to the big node
          cpu: "4"
        limits:
          memory: 12Gi # <= LimitRange max
          cpu: "16" # <= LimitRange max; let nix use many of k8s-3's 24 cores
when:
  event: [push, pull_request, cron]
  cron: nightly
steps:
  # Update flake inputs (cron only)
  update-flake:
    image: nixos/nix:latest
    when:
      event: cron
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - git config user.name "Woodpecker CI"
      - git config user.email "ci@woodpecker.local"
      - nix flake update --extra-experimental-features 'nix-command flakes'
      - |
        if git diff --quiet flake.lock; then
          echo "No changes to flake.lock"
        else
          git add flake.lock
          git commit -m "chore: update flake inputs"
          git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/whexy/dotfiles.git
          git push origin HEAD:master
        fi
  # Run lint checks and evaluate NixOS configurations without building every
  # Blueprint-generated host closure. `nix flake check --all-systems` is too
  # memory-heavy for this repo after Blueprint host discovery.
  check-flake:
    image: nixos/nix:latest
    backend_options: *k8s_heavy
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Running pre-commit checks ==="
      - SYSTEM=$(nix eval --raw --impure --expr 'builtins.currentSystem' --extra-experimental-features 'nix-command flakes')
      - nix build --extra-experimental-features 'nix-command flakes' ".#checks.${SYSTEM}.pre-commit" -L --no-link
      - echo "=== Evaluating representative NixOS configurations ==="
      - |
        for config in \
          remote-dev \
          ord \
          wsl \
          remote-service
        do
          echo "Evaluating $config..."
          nix eval --extra-experimental-features 'nix-command flakes' ".#nixosConfigurations.${config}.config.system.build.toplevel.drvPath" --show-trace
          echo "OK - $config"
        done
      - echo "OK - representative NixOS configurations evaluate correctly"
  # Evaluate darwin and home-manager configurations (not covered by flake check)
  check-extra-configs:
    image: nixos/nix:latest
    backend_options: *k8s_heavy
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Evaluating darwin configurations ==="
      - nix eval --extra-experimental-features 'nix-command flakes' .#darwinConfigurations.mba.system.drvPath --show-trace
      - echo "OK - mba"
      - nix eval --extra-experimental-features 'nix-command flakes' .#darwinConfigurations.mini.system.drvPath --show-trace
      - echo "OK - mini"
      - echo "=== Evaluating home-manager configurations ==="
      - nix eval --extra-experimental-features 'nix-command flakes' .#homeConfigurations.home.activationPackage.drvPath --impure --show-trace
      - echo "OK - home (x86_64)"
      - nix eval --extra-experimental-features 'nix-command flakes' .#homeConfigurations.home-aarch64.activationPackage.drvPath --impure --show-trace
      - echo "OK - home-aarch64"
      - nix eval --extra-experimental-features 'nix-command flakes' .#homeConfigurations.home-base.activationPackage.drvPath --impure --show-trace
      - echo "OK - home-base (x86_64)"
      - nix eval --extra-experimental-features 'nix-command flakes' .#homeConfigurations.home-base-aarch64.activationPackage.drvPath --impure --show-trace
      - echo "OK - home-base-aarch64"
      - echo "SUCCESS - All configurations evaluate correctly"
  # Build docs (tailwindcss) only when docs/ changes on master
  build-docs:
    image: nixos/nix:latest
    backend_options: *k8s_heavy
    when:
      - event: push
        branch: master
        path: "docs/**"
    commands:
      - echo "=== Building docs/output.css with tailwindcss ==="
      - nix run --extra-experimental-features 'nix-command flakes' nixpkgs#tailwindcss_4 -- -i docs/input.css -o docs/output.css --minify
      - echo "OK - docs built"
  # Deploy docs to Cloudflare Workers (static assets) only when docs/ changes on master
  deploy-docs:
    image: node:22-alpine
    when:
      - event: push
        branch: master
        path: "docs/**"
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CLOUDFLARE_ACCOUNT_ID
    commands:
      - echo "=== Deploying docs to Cloudflare Workers ==="
      - cd docs
      - npx --yes wrangler@latest deploy
      - echo "OK - deployed"
    depends_on: [build-docs]
