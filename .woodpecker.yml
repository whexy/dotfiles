# Pin heavy Nix steps to the big node (k8s-3). Referenced via YAML anchor below.
variables:
  - &k8s_heavy
    kubernetes:
      resources:
        requests:
          memory: 8Gi # only k8s-3 (~45Gi) can satisfy -> pinned to the big node
          cpu: "4"
        limits:
          memory: 12Gi # <= LimitRange max
          cpu: "16" # <= LimitRange max; let nix use many of k8s-3's 24 cores
when:
  event: [push, pull_request, cron, manual]
  cron: nightly
steps:
  # Update flake inputs (cron only)
  update-flake:
    image: nixos/nix:latest
    when:
      event: [cron, manual]
    environment:
      GITHUB_APP_ID:
        from_secret: github_app_id
      GITHUB_APP_INSTALLATION_ID:
        from_secret: github_app_installation_id
      GITHUB_APP_PRIVATE_KEY:
        from_secret: github_app_private_key
      NIX_CONFIG: |
        experimental-features = nix-command flakes
    commands:
      - git config user.name "whexy-bot[bot]"
      - git config user.email "315421218+whexy-bot[bot]@users.noreply.github.com"
      - nix flake update
      - |
        if git diff --quiet flake.lock; then
          echo "No changes to flake.lock"
        else
          git add flake.lock
          git commit -m "chore: update flake inputs"
          GITHUB_TOKEN="$(nix run .#github-app-token)"
          git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/whexy/dotfiles.git
          git push origin HEAD:master
        fi
  # Run lint checks and evaluate NixOS configurations without building every
  # Blueprint-generated host closure. `nix flake check --all-systems` is too
  # memory-heavy for this repo after Blueprint host discovery.
  check-flake:
    image: nixos/nix:latest
    backend_options: *k8s_heavy
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Running pre-commit checks ==="
      - |
        SYSTEM=$(nix eval --accept-flake-config --raw --impure --expr 'builtins.currentSystem' --extra-experimental-features 'nix-command flakes')
        nix build --accept-flake-config --extra-experimental-features 'nix-command flakes' ".#checks.$SYSTEM.pre-commit" -L --no-link
      - echo "=== Evaluating representative NixOS configurations ==="
      - |
        for config in \
          remote-dev \
          ord \
          wsl \
          remote-service
        do
          echo "Evaluating $config..."
          nix eval --accept-flake-config --extra-experimental-features 'nix-command flakes' ".#nixosConfigurations.$config.config.system.build.toplevel.drvPath" --show-trace
          echo "OK - $config"
        done
      - echo "OK - representative NixOS configurations evaluate correctly"
  # Evaluate darwin and home-manager configurations (not covered by flake check)
  check-extra-configs:
    image: nixos/nix:latest
    backend_options: *k8s_heavy
    when:
      event: [push, pull_request]
    commands:
      - echo "=== Evaluating darwin configurations ==="
      - nix eval --extra-experimental-features 'nix-command flakes' .#darwinConfigurations.mba.system.drvPath --show-trace
      - echo "OK - mba"
      - nix eval --extra-experimental-features 'nix-command flakes' .#darwinConfigurations.mini.system.drvPath --show-trace
      - echo "OK - mini"
      - echo "=== Evaluating home-manager configurations ==="
      - nix eval --extra-experimental-features 'nix-command flakes' .#homeConfigurations.wenxuan@mars.activationPackage.drvPath --impure --show-trace
      - echo "OK - mars (x86_64)"
      - echo "SUCCESS - All configurations evaluate correctly"
  # Build docs (astro) only when docs/ changes on master
  build-docs:
    image: node:22-alpine
    when:
      - event: push
        branch: master
        path: "docs/**"
    commands:
      - echo "=== Building docs with astro ==="
      - cd docs
      - npm ci
      - npm run build
      - echo "OK - docs built"
  # Deploy docs to Cloudflare Workers (static assets) only when docs/ changes on master
  deploy-docs:
    image: node:22-alpine
    when:
      - event: push
        branch: master
        path: "docs/**"
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CLOUDFLARE_ACCOUNT_ID
    commands:
      - echo "=== Deploying docs to Cloudflare Workers ==="
      - cd docs
      - npx --yes wrangler@latest deploy
      - echo "OK - deployed"
    depends_on: [build-docs]
