# Woodpecker substitutes braced variables anywhere in this file, so inline
# scripts refer to shell variables only as bare $name; the lanes' scripts
# live in ci/.
variables:
  # Run the heavy Nix steps on k8s-3, beside the CI cache. They take less than
  # half as long there as on k8s-4 or k8s-5, which have as much memory, so the
  # request alone does not keep them off those nodes.
  - &k8s_heavy
    kubernetes:
      nodeSelector:
        kubernetes.io/hostname: k8s-3
      resources:
        requests:
          memory: 8Gi
          cpu: "4"
        limits:
          memory: 12Gi # <= LimitRange max
          cpu: "16" # <= LimitRange max; let nix use many of k8s-3's 24 cores
  # The shared CI cache's credentials, the only secrets a pull-request step may
  # have. nix-ci fetches whatever an earlier run built and uploads, signed,
  # what this one builds, so a package or check none of whose inputs changed
  # is downloaded instead of built.
  - &ci_cache
    AWS_ACCESS_KEY_ID:
      from_secret: ci_cache_access_key
    AWS_SECRET_ACCESS_KEY:
      from_secret: ci_cache_secret_key
    NIX_CACHE_SIGNING_KEY:
      from_secret: nix_cache_signing_key
  # GitHub App credentials, the build cache and Rex's token, which the update
  # lane needs.
  - &github_app
    <<: *ci_cache
    GITHUB_APP_ID:
      from_secret: github_app_id
    GITHUB_APP_INSTALLATION_ID:
      from_secret: github_app_installation_id
    GITHUB_APP_PRIVATE_KEY:
      from_secret: github_app_private_key
    REX_PACKAGE_TOKEN:
      from_secret: rex_package_token
  # pkgs.superlogical.com serves the rex input only with Rex's testing token.
  # A pull-request step goes without it and substitutes the input from the CI
  # cache, where every check on master archives it.
  - &rex_netrc |
    netrc=$(mktemp)
    printf 'machine pkgs.superlogical.com login rex password %s\n' "$REX_PACKAGE_TOKEN" >"$netrc"
    export NIX_CONFIG="$NIX_CONFIG
    netrc-file = $netrc"
# Branches other than master are checked through their pull requests.
when:
  - event: push
    branch: master
  - event: [pull_request, manual]
  - event: cron
    cron: nightly
labels:
  platform: linux/amd64
clone:
  # The clone's Pod binds the local-path workspace to its node, and every later
  # step follows it there, so it asks for what the heavy steps need.
  - name: git
    image: woodpeckerci/plugin-git
    backend_options: *k8s_heavy
steps:
  # Update every flake input and every package that pins an upstream release
  # (nightly cron, or a manual run), one commit each, then check the commits
  # and push them directly to the repository's primary branch.
  update:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    when:
      - event: cron
        cron: nightly
      # whexy/t3code's CI starts a manual run with T3CODE_FORK_REV after each
      # build; it is not a request to update.
      - event: manual
        evaluate: '(T3CODE_FORK_REV ?? "") == ""'
    backend_options: *k8s_heavy
    environment: *github_app
    commands:
      - *rex_netrc
      - bash ci/update.sh
  # Pin the t3code-fork input to a commit whexy/t3code's CI built and pushed
  # to whexy-t3code.cachix.org. That CI starts this lane through Woodpecker's
  # API, as a manual run with the variable T3CODE_FORK_REV; no other manual
  # step runs then. A rev that is no longer the fork's head is superseded by
  # the run its successor starts, so it ends without pinning.
  pin-t3code-fork:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    when:
      - event: manual
        evaluate: '(T3CODE_FORK_REV ?? "") != ""'
    backend_options: *k8s_heavy
    environment: *github_app
    commands:
      - *rex_netrc
      - bash ci/pin-t3code-fork.sh
  # Build every check and evaluate every configuration.
  check:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    backend_options: *k8s_heavy
    when:
      event: push
    environment:
      <<: *ci_cache
      REX_PACKAGE_TOKEN:
        from_secret: rex_package_token
    commands:
      - *rex_netrc
      - bash ci/check.sh
  # Woodpecker fails a step that names a secret its event may not use, so pull
  # requests check in their own step, without Rex's token.
  check-pr:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    backend_options: *k8s_heavy
    when:
      event: pull_request
    environment: *ci_cache
    commands:
      - bash ci/check.sh
  # Build docs (astro) only when docs/ changes on master
  build-docs:
    image: node:22-alpine
    when:
      - event: push
        branch: master
        path: "docs/**"
    commands:
      - echo "=== Building docs with astro ==="
      - cd docs
      - npm ci
      - npm run build
      - echo "OK - docs built"
  # Deploy docs to Cloudflare Workers (static assets) only when docs/ changes on master
  deploy-docs:
    image: node:22-alpine
    when:
      - event: push
        branch: master
        path: "docs/**"
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CLOUDFLARE_ACCOUNT_ID
    commands:
      - echo "=== Deploying docs to Cloudflare Workers ==="
      - cd docs
      # wrangler is a docs devDependency, installed by build-docs.
      - npx wrangler deploy
      - echo "OK - deployed"
  # Announce the commit to the hosts (flake.lib.rollout,
  # packages/dotfiles-upgraded/README.md). No step sets depends_on, so this
  # runs only once every step before it passed, and a failed announcement
  # fails the push pipeline: GitHub then never reports success on a commit the
  # hosts were not told about. Only the tip of master is announced, since a
  # rerun of an older pipeline would hand hosts an older commit under a newer
  # pipeline number.
  announce:
    image: ghcr.io/whexy/nix-ci:0.1.0-alpha.2
    when:
      event: push
      branch: master
    backend_options: *k8s_heavy
    environment:
      <<: *ci_cache
      ROLLOUT_SIGNING_KEY:
        from_secret: rollout_signing_key
      NTFY_ROLLOUT_TOKEN:
        from_secret: ntfy_rollout_token
    commands:
      - |
        head=$(git ls-remote --exit-code https://github.com/whexy/dotfiles refs/heads/master | cut -f1)
        if [ "$head" != "$CI_COMMIT_SHA" ]; then
          echo "SUPERSEDED - $CI_COMMIT_SHA is no longer the tip of master"
          exit 0
        fi
        topic=$(nix eval --raw .#lib.rollout.topic)
        public_key=$(nix eval --raw .#lib.rollout.publicKey)
        nix run --accept-flake-config .#dotfiles-upgraded -- announce \
          --url "http://ntfy.ntfy.svc.cluster.local/$topic" --public-key "$public_key" \
          --sha "$CI_COMMIT_SHA" --seq "$CI_PIPELINE_NUMBER"
  # Report a failure on master to the T3 Code task that repairs it (see
  # AGENTS.md). It runs last and no step sets depends_on, so the steps run in
  # order and a failure in any of them reaches this one. Should the task not
  # take the report, the alert webhook sends it to WeChat instead.
  report-failure:
    image: curlimages/curl:8.19.0
    when:
      - event: [push, cron, manual]
        branch: master
        status: failure
    environment:
      T3_REPAIR_WEBHOOK:
        from_secret: t3_repair_webhook
    commands:
      - |
        # A cron pipeline's message is the cron's name.
        cron=
        if [ "$CI_PIPELINE_EVENT" = cron ]; then cron=$CI_COMMIT_MESSAGE; fi
        # The pin lane's rev, which the task's dedupe key includes.
        case $T3CODE_FORK_REV in
          *[!0-9a-f]*) rev=invalid ;;
          *) rev=$T3CODE_FORK_REV ;;
        esac
        body=$(printf '{"event":"%s","cron":"%s","branch":"%s","commit":"%s","pipeline":"%s","pipeline_url":"%s","t3code_fork_rev":"%s"}' \
          "$CI_PIPELINE_EVENT" "$cron" "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA" "$CI_PIPELINE_NUMBER" "$CI_PIPELINE_URL" "$rev")
        # Bounded, so a stalled task server still leaves time for the alert.
        if headers=$(curl -fsS --connect-timeout 5 --max-time 20 -o /dev/null -D - -X POST \
          -H 'content-type: application/json' --data "$body" "$T3_REPAIR_WEBHOOK"); then
          printf '%s\n' "$headers" | grep -i '^x-t3-hook-outcome'
        else
          alert=$(printf '{"source":"dotfiles-ci","severity":"error","title":"%s","detail":"%s","url":"%s"}' \
            "dotfiles pipeline $CI_PIPELINE_NUMBER failed and its repair task did not take it" \
            "event=$CI_PIPELINE_EVENT commit=$CI_COMMIT_SHA t3code_fork_rev=$rev" "$CI_PIPELINE_URL")
          curl -fsS -o /dev/null --max-time 10 -X POST -H 'content-type: application/json' \
            --data "$alert" https://n8n.clusters.work/webhook/t3code-alert
          exit 1
        fi
