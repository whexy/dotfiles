      <h1 class="text-4xl font-bold mb-2">
        <a
          href="https://github.com/whexy/dotfiles"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-stone-600 transition-colors inline-flex items-center gap-2"
        >
          Dotfiles
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="opacity-50"
          >
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </a>
      </h1>
      <p class="text-xl text-stone-600 mb-8">
        Reproducible chaos across machines.
      </p>

      <div class="border border-stone-300 rounded p-6">
        <div class="flex gap-2 mb-4 text-sm">
          <button
            class="tab-button px-3 py-1 rounded hover:bg-stone-100 transition-colors"
            data-tab="linux-x86"
            data-command="home-manager switch --flake github:whexy/dotfiles#home --impure"
          >
            Dotfiles (x86_64)
          </button>
          <button
            class="tab-button px-3 py-1 rounded hover:bg-stone-100 transition-colors"
            data-tab="linux-aarch64"
            data-command="home-manager switch --flake github:whexy/dotfiles#home-aarch64 --impure"
          >
            Dotfiles (aarch64)
          </button>
          <button
            class="tab-button px-3 py-1 rounded hover:bg-stone-100 transition-colors"
            data-tab="macos"
            data-command="sudo darwin-rebuild switch --flake github:whexy/dotfiles#mbp"
          >
            macOS
          </button>
          <button
            class="tab-button px-3 py-1 rounded hover:bg-stone-100 transition-colors"
            data-tab="nixos"
            data-command="sudo nixos-rebuild switch --flake github:whexy/dotfiles#remote-dev"
          >
            NixOS
          </button>
          <button
            class="tab-button px-3 py-1 rounded hover:bg-stone-100 transition-colors"
            data-tab="wsl"
            data-command="nix build github:whexy/dotfiles#nixosConfigurations.wsl.config.system.build.tarballBuilder && sudo ./result/bin/nixos-wsl-tarball-builder"
          >
            WSL
          </button>
        </div>
        <div class="flex border border-stone-300 rounded overflow-hidden">
          <code
            id="command-display"
            class="font-mono text-sm bg-stone-50 p-3 flex-1 overflow-x-auto whitespace-nowrap"
          >
            $ home-manager switch --flake github:whexy/dotfiles#home --impure
          </code>
          <button
            id="copy-button"
            class="px-4 hover:bg-stone-100 transition-colors flex-shrink-0"
            title="Copy to clipboard"
            type="button"
            aria-label="Copy command to clipboard"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path
                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <footer class="mt-12 pb-8 flex justify-center gap-4">
        <a
          href="https://github.com/whexy"
          target="_blank"
          rel="noopener noreferrer"
          class="w-10 h-10 flex items-center justify-center rounded hover:bg-stone-100 transition-colors"
          aria-label="GitHub"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

            />

        </a>
        <a
          href="https://whexy.com"
          target="_blank"
          rel="noopener noreferrer"
          class="w-10 h-10 flex items-center justify-center rounded hover:bg-stone-100 transition-colors"
          aria-label="Blog"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>

              d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"

          aria-label="Personal Website"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10"></circle>

              d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"

        </a>

    </div>

    <script>
      let currentCommand =
        "home-manager switch --flake github:whexy/dotfiles#home --impure";

      // Set initial active tab
      document
        .querySelector('[data-tab="linux-x86"]')
        .classList.add("bg-stone-200");

      // Tab switching
      document.querySelectorAll(".tab-button").forEach((button) => {
        button.addEventListener("click", () => {
          // Remove active state from all tabs
          document.querySelectorAll(".tab-button").forEach((btn) => {
            btn.classList.remove("bg-stone-200");
          });

          // Add active state to clicked tab
          button.classList.add("bg-stone-200");

          // Update command display
          currentCommand = button.getAttribute("data-command");
          document.getElementById("command-display").textContent =
            "$ " + currentCommand;
        });
      });

      // Copy button
      document.getElementById("copy-button").addEventListener("click", () => {
        navigator.clipboard.writeText(currentCommand);
      });
    </script>
  </body>
</html>
