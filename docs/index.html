<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>whexy/Dotfiles</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="max-w-4xl mx-auto px-4 flex min-h-screen items-center">
    <div class="w-full">
      <svg

        />
        <polygon

          points="528.0000000000002 415.6921938165302 272.00000000000017 415.69219381653045 831.9999999999998 -554.2562584220411 959.9999999999999 -332.5537550532249 832.0000000000001 -110.85125168440845 1088.0 -110.8512516844084 1152.0 -2.8421709430404007e-13 1088.0 110.85125168440794 704.0000000000001 110.85125168440788"

        <polygon

          points="-96.0 665.1075101064489 -224.00000000000009 443.40500673763256 896.0 443.4050067376328 768.0 665.107510106449 511.9999999999999 665.1075101064491 639.9999999999997 886.8100134752656 575.9999999999997 997.6612651596736 447.99999999999966 997.6612651596737 255.9999999999999 665.107510106449"

      </svg>
      <h1 class="text-4xl font-bold mb-2">
        <a
          href="https://github.com/whexy/dotfiles"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-stone-600 transition-colors inline-flex items-center gap-2"
        >
          Dotfiles
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="opacity-50"
          >
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </a>
      </h1>
      <p class="text-xl text-stone-600 mb-8">
        Reproducible chaos across machines.
      </p>

      <div class="border border-stone-300 rounded p-4 sm:p-6">
        <!-- Category row -->
        <div
          class="flex flex-wrap items-center gap-x-4 gap-y-1 border-b border-stone-200 pb-3"
        >
          <button
            class="category-button text-sm py-1 border-b-2 border-transparent transition-colors"
            data-category="nixos"
          >
            NixOS
          </button>
          <button
            class="category-button text-sm py-1 border-b-2 border-transparent transition-colors"
            data-category="macos"
          >
            macOS
          </button>
          <button
            class="category-button text-sm py-1 border-b-2 border-transparent transition-colors"
            data-category="home"
          >
            Home Manager
          </button>
          <button
            class="category-button text-sm py-1 border-b-2 border-transparent transition-colors"
            data-category="vm"
          >
            VM Images
          </button>

          <label
            id="nh-toggle-wrapper"
            class="ml-auto inline-flex items-center gap-2 text-sm text-stone-600 cursor-pointer select-none"
          >
            <input
              id="nh-toggle"
              type="checkbox"
              class="accent-stone-700 cursor-pointer"
            />
            <span>Use <code class="font-mono">nh</code></span>
          </label>
        </div>

        <!-- Target row -->
        <div
          id="target-row"
          class="flex flex-wrap gap-2 mt-3 transition-opacity duration-150"
        ></div>

        <!-- Command display -->
        <div class="flex border border-stone-300 rounded overflow-hidden mt-3">
          <code
            id="command-display"
            class="font-mono text-sm bg-stone-50 p-3 flex-1 overflow-x-auto whitespace-nowrap"
          >
          </code>
          <button
            id="copy-button"
            class="px-4 hover:bg-stone-100 transition-colors flex-shrink-0"
            title="Copy to clipboard"
            type="button"
            aria-label="Copy command to clipboard"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path
                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
              ></path>
            </svg>
          </button>
        </div>

        <!-- Description -->
        <p
          id="command-description"
          class="text-sm text-stone-500 mt-2 min-h-5"
        ></p>
      </div>

      <footer class="mt-12 pb-8 flex justify-center gap-4">
        <a
          href="https://github.com/whexy"
          target="_blank"
          rel="noopener noreferrer"
          class="w-10 h-10 flex items-center justify-center rounded hover:bg-stone-100 transition-colors"
          aria-label="GitHub"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
            />
          </svg>
        </a>
        <a
          href="https://whexy.com"
          target="_blank"
          rel="noopener noreferrer"
          class="w-10 h-10 flex items-center justify-center rounded hover:bg-stone-100 transition-colors"
          aria-label="Blog"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path
              d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
            ></path>
          </svg>
        </a>
        <a
          href="https://shiwx.org"
          target="_blank"
          rel="noopener noreferrer"
          class="w-10 h-10 flex items-center justify-center rounded hover:bg-stone-100 transition-colors"
          aria-label="Personal Website"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path
              d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
            ></path>
          </svg>
        </a>
      </footer>
    </div>

    <script>
      const categories = {
        nixos: [
          {
            label: "ord",
            cmd: "sudo nixos-rebuild switch --flake github:whexy/dotfiles#ord",
            nhCmd: "nh os switch --hostname ord github:whexy/dotfiles",
            description: "Home workstation (Ryzen 5800X) - base + dev + gui.",
          },
          {
            label: "remote-dev",
            cmd: "sudo nixos-rebuild switch --flake github:whexy/dotfiles#remote-dev",
            nhCmd: "nh os switch --hostname remote-dev github:whexy/dotfiles",
            description:
              "Lab dev VM on b3srv0 (Threadripper 9995WX) - base + dev.",
          },
          {
            label: "mvp",
            cmd: "sudo nixos-rebuild switch --flake github:whexy/dotfiles#mvp",
            nhCmd: "nh os switch --hostname mvp github:whexy/dotfiles",
            description: "Lab workstation VM (Ryzen 5700X) - base + dev.",
          },
          {
            label: "mba-nixos",
            cmd: "sudo nixos-rebuild switch --flake github:whexy/dotfiles#mba-nixos",
            nhCmd: "nh os switch --hostname mba-nixos github:whexy/dotfiles",
            description:
              "Apple M5 MacBook Air running NixOS - base + dev + gui.",
          },
          {
            label: "remote-basic",
            cmd: "sudo nixos-rebuild switch --flake github:whexy/dotfiles#remote-basic",
            nhCmd: "nh os switch --hostname remote-basic github:whexy/dotfiles",
            description: "Minimal generic remote host - base only.",
          },
        ],
        macos: [
          {
            label: "MacBook Air",
            cmd: "sudo darwin-rebuild switch --flake github:whexy/dotfiles#mba",
            nhCmd: "nh darwin switch --hostname mba github:whexy/dotfiles",
            description: "MacBook Air - base + dev-lite + gui.",
          },
          {
            label: "Mac Mini",
            cmd: "sudo darwin-rebuild switch --flake github:whexy/dotfiles#mini",
            nhCmd: "nh darwin switch --hostname mini github:whexy/dotfiles",
            description: "Mac Mini desktop - base + dev-lite + gui.",
          },
        ],
        home: [
          {
            label: "Dotfiles (x86_64)",
            cmd: "home-manager switch --flake github:whexy/dotfiles#home --impure",
            nhCmd:
              "nh home switch github:whexy/dotfiles --no-nom --impure -c home -b backup",
            description:
              "Full dotfiles (base + dev) for x86_64 Linux. Requires --impure for $USER/$HOME.",
          },
          {
            label: "Dotfiles (aarch64)",
            cmd: "home-manager switch --flake github:whexy/dotfiles#home-aarch64 --impure",
            nhCmd:
              "nh home switch github:whexy/dotfiles --no-nom --impure -c home-aarch64 -b backup",
            description:
              "Full dotfiles (base + dev) for aarch64 Linux. Requires --impure for $USER/$HOME.",
          },
          {
            label: "Base (x86_64)",
            cmd: "home-manager switch --flake github:whexy/dotfiles#home-base --impure",
            nhCmd:
              "nh home switch github:whexy/dotfiles --no-nom --impure -c home-base -b backup",
            description: "Minimal dotfiles (base only) for x86_64 Linux.",
          },
          {
            label: "Base (aarch64)",
            cmd: "home-manager switch --flake github:whexy/dotfiles#home-base-aarch64 --impure",
            nhCmd:
              "nh home switch github:whexy/dotfiles --no-nom --impure -c home-base-aarch64 -b backup",
            description: "Minimal dotfiles (base only) for aarch64 Linux.",
          },
        ],
        vm: [
          {
            label: "WSL tarball",
            cmd: "just build-wsl",
            description:
              "NixOS-WSL importable tarball (base + dev). Import with: wsl --import NixOS <path> result/wsl/nixos.wsl.",
          },
          {
            label: "Proxmox (remote-service)",
            cmd: "just build-proxmox remote-service",
            description:
              "Proxmox VMA image for the remote-service host (base + service).",
          },
          {
            label: "UTM (x86_64)",
            cmd: "just build-desktop utm x86_64",
            description:
              "UTM qcow2 desktop image for x86_64 (base + dev + gui).",
          },
          {
            label: "UTM (aarch64)",
            cmd: "just build-desktop utm aarch64",
            description:
              "UTM qcow2 desktop image for aarch64 (base + dev + gui).",
          },
          {
            label: "VMware (x86_64)",
            cmd: "just build-desktop vmware x86_64",
            description:
              "VMware VMDK desktop image for x86_64 (base + dev + gui).",
          },
          {
            label: "VMware (aarch64)",
            cmd: "just build-desktop vmware aarch64",
            description:
              "VMware VMDK desktop image for aarch64 (base + dev + gui).",
          },
        ],
      };

      let currentCommand = "";
      let activeCategory = "nixos";
      let activeTargetIndex = 0;
      let useNh = false;

      const targetRow = document.getElementById("target-row");
      const commandDisplay = document.getElementById("command-display");
      const commandDescription = document.getElementById("command-description");
      const nhToggle = document.getElementById("nh-toggle");
      const nhToggleWrapper = document.getElementById("nh-toggle-wrapper");

      function resolveCommand(target) {
        if (activeCategory === "vm") return target.cmd;
        if (useNh && target.nhCmd) return target.nhCmd;
        return target.cmd;
      }

      function renderActiveTarget() {
        const target = categories[activeCategory][activeTargetIndex];
        if (!target) return;
        currentCommand = resolveCommand(target);
        commandDisplay.textContent = "$ " + currentCommand;
        commandDescription.textContent = target.description || "";
      }

      function renderTargets(categoryKey, selectIndex) {
        const targets = categories[categoryKey];

        // Fade out
        targetRow.style.opacity = "0";

        setTimeout(() => {
          targetRow.innerHTML = "";
          targets.forEach((target, i) => {
            const btn = document.createElement("button");
            btn.textContent = target.label;
            btn.className =
              "target-button px-3 py-1.5 rounded text-sm transition-colors hover:bg-stone-100";
            if (i === selectIndex) {
              btn.classList.add("bg-stone-200");
            }
            btn.addEventListener("click", () => {
              activeTargetIndex = i;
              document.querySelectorAll(".target-button").forEach((b) => {
                b.classList.remove("bg-stone-200");
              });
              btn.classList.add("bg-stone-200");
              renderActiveTarget();
            });
            targetRow.appendChild(btn);
          });

          renderActiveTarget();

          // Fade in
          targetRow.style.opacity = "1";
        }, 100);
      }

      function updateNhToggleVisibility() {
        if (activeCategory === "vm") {
          nhToggleWrapper.classList.add("hidden");
        } else {
          nhToggleWrapper.classList.remove("hidden");
        }
      }

      function selectCategory(categoryKey) {
        activeCategory = categoryKey;
        activeTargetIndex = 0;

        // Update category button styles
        document.querySelectorAll(".category-button").forEach((btn) => {
          if (btn.dataset.category === categoryKey) {
            btn.classList.add(
              "text-stone-900",
              "font-medium",
              "border-stone-900",
            );
            btn.classList.remove("text-stone-400");
          } else {
            btn.classList.remove(
              "text-stone-900",
              "font-medium",
              "border-stone-900",
            );
            btn.classList.add("text-stone-400");
          }
        });

        updateNhToggleVisibility();
        renderTargets(categoryKey, 0);
      }

      // Bind category buttons
      document.querySelectorAll(".category-button").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectCategory(btn.dataset.category);
        });
      });

      // nh toggle
      nhToggle.addEventListener("change", (e) => {
        useNh = e.target.checked;
        renderActiveTarget();
      });

      // Copy button
      document.getElementById("copy-button").addEventListener("click", () => {
        navigator.clipboard.writeText(currentCommand);
      });

      // Initialize
      selectCategory("nixos");
    </script>
  </body>
</html>
