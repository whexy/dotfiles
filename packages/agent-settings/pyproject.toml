[project]
name = "agent-settings"
version = "1.0.0"
description = "Writable Claude Code and Codex model selection with Nix-maintained defaults"
requires-python = ">=3.13"
dependencies = ["tomlkit", "textual"]

[project.scripts]
agent-settings = "agent_settings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_settings"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "recommended"
# Discarding dict.pop() and similar results is idiomatic here.
reportUnusedCallResult = false
executionEnvironments = [
  # Mocks are untyped by design.
  { root = "tests", reportAny = false, reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false, reportPrivateUsage = false },
  { root = "src" },
]

[tool.ruff.lint.isort]
known-first-party = ["agent_settings"]
known-third-party = ["support"]
