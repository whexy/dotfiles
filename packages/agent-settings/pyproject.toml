[project]
name = "agent-settings"
version = "1.0.0"
description = "Writable Claude Code, Codex, and Muse Code model selection with Nix-maintained defaults"
requires-python = ">=3.13"
dependencies = ["tomlkit", "textual"]

[project.scripts]
agent-settings = "agent_settings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_settings"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "recommended"
# Discarding dict.pop() and similar results is idiomatic here.
reportUnusedCallResult = false

[tool.ruff.lint.isort]
known-first-party = ["agent_settings"]
