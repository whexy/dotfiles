[project]
name = "agent-settings"
version = "1.0.0"
description = "Writable Claude Code, Codex, and Muse Code model selection with Nix-maintained defaults"
requires-python = ">=3.13"
dependencies = ["tomlkit", "textual"]

[project.scripts]
agent-settings = "agent_settings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_settings"]

[tool.ruff]
extend = "../../lib/python-checks/pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["agent_settings"]

[tool.basedpyright]
extends = "../../lib/python-checks/pyproject.toml"
include = ["src"]
