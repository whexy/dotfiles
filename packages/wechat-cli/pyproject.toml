[project]
name = "wechat-cli"
version = "0.2.0"
description = "Message your own WeChat through the wechat-relay service"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
wechat = "wechat_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_cli"]

[tool.ruff]
extend = "../../lib/python-checks/pyproject.toml"

[tool.basedpyright]
extends = "../../lib/python-checks/pyproject.toml"
include = ["src"]
# Wire payloads are untyped JSON; they are narrowed where read.
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
