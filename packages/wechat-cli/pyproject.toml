[project]
name = "wechat-cli"
version = "0.2.0"
description = "Message your own WeChat through the wechat-relay service"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
wechat = "wechat_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "recommended"
reportUnusedCallResult = false
# Wire payloads are untyped JSON; they are narrowed where read.
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
executionEnvironments = [
  { root = "tests", reportPrivateUsage = false },
  { root = "src" },
]
