apiVersion: apps/v1
kind: Deployment
metadata:
  name: <name>
  namespace: <name>
  labels:
    app: <name>
spec:
  # One writer per data directory: never run two Pods against the same claim.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: <name>
  template:
    metadata:
      labels:
        app: <name>
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: <name>
          image: ghcr.io/whexy/<name>:<version>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: <port>
          env:
            - name: DATA_DIR
              value: /data
            - name: <SECRET_ENV>
              valueFrom:
                secretKeyRef:
                  name: <name>
                  key: <SECRET_ENV>
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: <name>-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
